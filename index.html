<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Solar System Explorer</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #03030c;
            color: #ffffff;
        }
        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }
        /* Custom Scrollbar for Info Modal */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="relative h-screen w-screen overflow-hidden select-none">

    <!-- 3D Canvas Container -->
    <div id="canvas-container" class="absolute inset-0 z-0"></div>

    <!-- UI Overlay Header -->
    <header class="absolute top-0 left-0 w-full p-6 z-10 flex justify-between items-center pointer-events-none">
        <div class="pointer-events-auto bg-black/40 backdrop-blur-md border border-white/10 px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-cyan-400 animate-ping"></div>
            <h1 class="text-xl font-bold tracking-wider bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">SOLARIS 3D</h1>
        </div>
        <div class="pointer-events-auto hidden md:flex gap-3">
            <button onclick="resetCamera()" class="bg-white/10 hover:bg-white/20 text-white border border-white/10 px-4 py-2 rounded-xl text-sm font-semibold transition backdrop-blur-md shadow-lg">Reset View</button>
            <button onclick="toggleOrbits()" id="orbit-toggle-btn" class="bg-white/10 hover:bg-white/20 text-white border border-white/10 px-4 py-2 rounded-xl text-sm font-semibold transition backdrop-blur-md shadow-lg">Toggle Orbits</button>
        </div>
    </header>

    <!-- Instructions Overlay -->
    <div class="absolute bottom-6 left-6 z-10 pointer-events-none hidden sm:block">
        <div class="bg-black/50 backdrop-blur-md border border-white/10 p-4 rounded-2xl text-xs text-gray-300 max-w-xs space-y-1 shadow-2xl">
            <p class="font-bold text-cyan-400">✨ Controls:</p>
            <p>• <b>Click & Drag:</b> Rotate view</p>
            <p>• <b>Scroll:</b> Zoom in / out</p>
            <p>• <b>Click Object:</b> Inspect Planet / Star</p>
        </div>
    </div>

    <!-- Info Modal Card (Appears on clicking any celestial body) -->
    <div id="info-card" class="absolute right-6 top-24 z-20 w-80 md:w-96 bg-black/70 backdrop-blur-xl border border-white/20 rounded-3xl p-6 shadow-2xl transform translate-x-[120%] transition-transform duration-500 ease-out">
        <div class="flex justify-between items-start mb-4">
            <div>
                <span id="info-category" class="text-xs uppercase tracking-widest text-cyan-400 font-bold">Celestial Body</span>
                <h2 id="info-title" class="text-2xl font-bold text-white mt-1">Sun</h2>
            </div>
            <button onclick="closeInfoCard()" class="text-gray-400 hover:text-white bg-white/10 hover:bg-white/20 w-8 h-8 rounded-full flex items-center justify-center transition">✕</button>
        </div>
        <div class="space-y-4 text-sm text-gray-300">
            <p id="info-desc" class="leading-relaxed">Loading details...</p>
            <div class="grid grid-cols-2 gap-3 pt-2 border-t border-white/10">
                <div class="bg-white/5 p-3 rounded-xl border border-white/5">
                    <span class="block text-[10px] text-gray-400 uppercase">Distance from Sun</span>
                    <span id="info-distance" class="font-bold text-white">-</span>
                </div>
                <div class="bg-white/5 p-3 rounded-xl border border-white/5">
                    <span class="block text-[10px] text-gray-400 uppercase">Diameter</span>
                    <span id="info-size" class="font-bold text-white">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- CDN Imports for Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Celestial Database ---
        const celestialData = {
            "Sun": {
                category: "Star • Center of Solar System",
                description: "The star at the heart of our solar system. Its gravity holds the solar system together, keeping everything from the biggest planets to the smallest debris in its orbit.",
                distance: "0 km",
                size: "1,392,700 km"
            },
            "Mercury": {
                category: "Terrestrial Planet",
                description: "The smallest planet in our solar system and nearest to the Sun. Mercury is only slightly larger than Earth's Moon.",
                distance: "57.9 million km",
                size: "4,879 km"
            },
            "Venus": {
                category: "Terrestrial Planet",
                description: "Spinning in the opposite direction to most other planets, Venus is the hottest planet in our solar system due to a runaway greenhouse effect.",
                distance: "108.2 million km",
                size: "12,104 km"
            },
            "Earth": {
                category: "Terrestrial Planet • Our Home",
                description: "Our home planet is the only place we know of so far that's inhabited by living things. It's the only planet in our solar system with liquid water on the surface.",
                distance: "149.6 million km",
                size: "12,742 km"
            },
            "Mars": {
                category: "Terrestrial Planet • The Red Planet",
                description: "A dusty, cold, desert world with a very thin atmosphere. There is strong evidence Mars was—billions of years ago— wetter and warmer, with a thicker atmosphere.",
                distance: "227.9 million km",
                size: "6,779 km"
            },
            "Jupiter": {
                category: "Gas Giant",
                description: "By far the largest planet in our solar system, more than twice as massive as all the other planets combined. Jupiter's iconic Great Red Spot is a giant storm bigger than Earth.",
                distance: "778.5 million km",
                size: "139,820 km"
            },
            "Saturn": {
                category: "Gas Giant • The Ringed Planet",
                description: "Adorned with a dazzling, complex system of icy rings, Saturn is unique in our solar system. The other giant planets have rings, but none are as spectacular as Saturn's.",
                distance: "1.43 billion km",
                size: "116,460 km"
            },
            "Uranus": {
                category: "Ice Giant",
                description: "Uranus rotates at a nearly 90-degree angle from the plane of its orbit. This unique tilt makes Uranus appear to spin on its side.",
                distance: "2.87 billion km",
                size: "50,724 km"
            },
            "Neptune": {
                category: "Ice Giant",
                description: "Dark, cold, and whipped by supersonic winds, ice giant Neptune is the eighth and most distant major planet in our solar system.",
                distance: "4.50 billion km",
                size: "49,244 km"
            },
            "Meteor": {
                category: "Asteroid Belt / Space Rock",
                description: "Remnants from the formation of our solar system, rocky bodies drifting through space or caught in gravitational fields.",
                distance: "Variable",
                size: "Varies (1-100 km)"
            }
        };

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 50, 120);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 600;
        controls.minDistance = 5;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0x333333);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2, 800, 0.5);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        // --- Starfield Background ---
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 3000;
        const starPositions = new Float32Array(starsCount * 3);

        for(let i = 0; i < starsCount * 3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 1200;
        }

        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.8 });
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // --- Sun Creation ---
        const sunGeometry = new THREE.SphereGeometry(7, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        sun.userData = { name: "Sun" };
        scene.add(sun);

        // Sun Glow Effect
        const glowGeometry = new THREE.SphereGeometry(8.5, 32, 32);
        const glowMaterial = new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.3 });
        const sunGlow = new THREE.Mesh(glowGeometry, glowMaterial);
        scene.add(sunGlow);

        // --- Planets Configuration ---
        const planetsData = [
            { name: "Mercury", size: 0.8, distance: 14, speed: 0.04, color: 0x888888 },
            { name: "Venus", size: 1.4, distance: 22, speed: 0.015, color: 0xe3bb76 },
            { name: "Earth", size: 1.6, distance: 32, speed: 0.01, color: 0x2277ff },
            { name: "Mars", size: 1.1, distance: 42, speed: 0.008, color: 0xc1440e },
            { name: "Jupiter", size: 3.5, distance: 58, speed: 0.004, color: 0xd4a373 },
            { name: "Saturn", size: 2.8, distance: 74, speed: 0.002, color: 0xf4e2bb, hasRings: true },
            { name: "Uranus", size: 2.0, distance: 90, speed: 0.0012, color: 0x73d2de },
            { name: "Neptune", size: 1.9, distance: 106, speed: 0.0008, color: 0x3b5fc0 }
        ];

        const planetMeshes = [];
        const orbitLines = [];

        planetsData.forEach(data => {
            // Orbit Ring Line
            const orbitGeo = new THREE.RingGeometry(data.distance - 0.05, data.distance + 0.05, 128);
            const orbitMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.08 });
            const orbitLine = new THREE.Mesh(orbitGeo, orbitMat);
            orbitLine.rotation.x = Math.PI / 2;
            scene.add(orbitLine);
            orbitLines.push(orbitLine);

            // Planet Mesh
            const planetGeo = new THREE.SphereGeometry(data.size, 32, 32);
            const planetMat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7 });
            const planet = new THREE.Mesh(planetGeo, planetMat);

            // Saturn Rings
            if (data.hasRings) {
                const ringGeo = new THREE.RingGeometry(data.size + 0.8, data.size + 2.5, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xc4b59d, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2;
                planet.add(ring);
            }

            planet.userData = { name: data.name };
            scene.add(planet);
            
            planetMeshes.push({
                mesh: planet,
                distance: data.distance,
                speed: data.speed,
                angle: Math.random() * Math.PI * 2
            });
        });

        // --- Meteors / Asteroid Belt Simulation ---
        const meteorCount = 150;
        const meteors = [];
        const meteorGeo = new THREE.DodecahedronGeometry(0.2, 0);
        const meteorMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.9 });

        for(let i = 0; i < meteorCount; i++) {
            const meteor = new THREE.Mesh(meteorGeo, meteorMat);
            const dist = 48 + Math.random() * 6;
            const angle = Math.random() * Math.PI * 2;
            meteor.position.set(Math.cos(angle) * dist, (Math.random() - 0.5) * 2, Math.sin(angle) * dist);
            meteor.userData = { name: "Meteor" };
            scene.add(meteor);
            meteors.push({ mesh: meteor, distance: dist, speed: 0.003 + Math.random() * 0.002, angle: angle });
        }

        // --- Raycasting for User Interaction ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            // Prevent clicking UI elements triggering 3D selection
            if (event.target.closest('#info-card') || event.target.closest('header') || event.target.closest('button')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            
            // Collect all interactive meshes
            const interactables = [sun, ...planetMeshes.map(p => p.mesh), ...meteors.map(m => m.mesh)];
            const intersects = raycaster.intersectObjects(interactables);

            if (intersects.length > 0) {
                const selectedObject = intersects[0].object;
                const name = selectedObject.userData.name;
                if (name && celestialData[name]) {
                    showInfoCard(name);
                }
            }
        });

        // --- UI Functions ---
        function showInfoCard(name) {
            const data = celestialData[name];
            document.getElementById('info-title').innerText = name;
            document.getElementById('info-category').innerText = data.category;
            document.getElementById('info-desc').innerText = data.description;
            document.getElementById('info-distance').innerText = data.distance;
            document.getElementById('info-size').innerText = data.size;

            const card = document.getElementById('info-card');
            card.classList.remove('translate-x-[120%]');
        }

        function closeInfoCard() {
            const card = document.getElementById('info-card');
            card.classList.add('translate-x-[120%]');
        }

        function resetCamera() {
            camera.position.set(0, 50, 120);
            controls.target.set(0, 0, 0);
            controls.update();
            closeInfoCard();
        }

        let orbitsVisible = true;
        function toggleOrbits() {
            orbitsVisible = !orbitsVisible;
            orbitLines.forEach(line => line.visible = orbitsVisible);
            const btn = document.getElementById('orbit-toggle-btn');
            btn.innerText = orbitsVisible ? "Hide Orbits" : "Show Orbits";
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            // Rotate Sun & Glow
            sun.rotation.y += 0.002;
            sunGlow.rotation.y -= 0.001;

            // Orbit Planets
            planetMeshes.forEach(item => {
                item.angle += item.speed;
                item.mesh.position.x = Math.cos(item.angle) * item.distance;
                item.mesh.position.z = Math.sin(item.angle) * item.distance;
                item.mesh.rotation.y += 0.01; // Self-rotation
            });

            // Move Meteors
            meteors.forEach(item => {
                item.angle += item.speed;
                item.mesh.position.x = Math.cos(item.angle) * item.distance;
                item.mesh.position.z = Math.sin(item.angle) * item.distance;
                item.mesh.rotation.x += 0.02;
                item.mesh.rotation.y += 0.03;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- Window Resize Handling ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
